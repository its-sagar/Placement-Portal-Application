{% extends "base.html" %}

{% block title %}Register Company - Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center mb-5" style="min-height: 80vh;">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden mt-4">
            <div class="card-header bg-secondary-gradient text-white text-center py-4">
                <h3 class="fw-bold mb-0">Company Registration</h3>
                <p class="mb-0 text-white-50">Partner with us to recruit top talent</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <form method="POST" action="{{ url_for('auth.register_company') }}">
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label class="form-label text-muted fw-semibold">Company Name</label>
                            <input type="text" class="form-control" name="company_name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted fw-semibold">HR Contact Number</label>
                            <input type="text" class="form-control" name="hr_contact" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted fw-semibold">Company Website (Optional)</label>
                        <input type="url" class="form-control" name="website" placeholder="https://example.com">
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label class="form-label text-muted fw-semibold">Username</label>
                            <input type="text" class="form-control" name="username" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted fw-semibold">Email Address</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted fw-semibold">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>

                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-success btn-lg py-2 fw-bold">Register as Company</button>
                    </div>
                    <div class="text-center text-muted small mb-3">
                        <i class="bi bi-info-circle me-1"></i> Note: Company accounts require admin approval before
                        login.
                    </div>
                    <div class="text-center">
                        <p class="text-muted mb-0">Already have an account? <a href="{{ url_for('auth.login') }}"
                                class="text-decoration-none fw-semibold">Login here</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
