{% extends "base.html" %}

{% block title %}Login - Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <div class="card-header bg-primary-gradient text-white text-center py-4">
                <h3 class="fw-bold mb-0">Welcome Back</h3>
                <p class="mb-0 text-white-50">Login to your account</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-4">
                        <label for="email" class="form-label text-muted fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i
                                    class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" name="email"
                                required autofocus placeholder="name@example.com">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label text-muted fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i
                                    class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password"
                                name="password" required placeholder="••••••••">
                        </div>
                    </div>
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label text-muted" for="remember">Remember me</label>
                    </div>
                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-primary btn-lg py-2 fw-bold">Sign In</button>
                    </div>
                    <div class="text-center">
                        <p class="text-muted mb-2">Don't have an account?</p>
                        <a href="{{ url_for('auth.register_student') }}"
                            class="text-decoration-none fw-semibold">Register as Student</a>
                        <span class="text-muted mx-2">|</span>
                        <a href="{{ url_for('auth.register_company') }}"
                            class="text-decoration-none fw-semibold">Register as Company</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
