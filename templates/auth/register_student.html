{% extends "base.html" %}

{% block title %}Register Student - Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center mb-5" style="min-height: 80vh;">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden mt-4">
            <div class="card-header bg-primary-gradient text-white text-center py-4">
                <h3 class="fw-bold mb-0">Student Registration</h3>
                <p class="mb-0 text-white-50">Join the portal to find your next opportunity</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <form method="POST" action="{{ url_for('auth.register_student') }}">
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label class="form-label text-muted fw-semibold">Full Name</label>
                            <input type="text" class="form-control" name="full_name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted fw-semibold">Enrollment Number</label>
                            <input type="text" class="form-control" name="enrollment_no" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label class="form-label text-muted fw-semibold">Username</label>
                            <input type="text" class="form-control" name="username" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted fw-semibold">Phone Number</label>
                            <input type="text" class="form-control" name="phone" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted fw-semibold">Email Address</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted fw-semibold">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>

                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-primary btn-lg py-2 fw-bold">Register as Student</button>
                    </div>
                    <div class="text-center">
                        <p class="text-muted mb-0">Already have an account? <a href="{{ url_for('auth.login') }}"
                                class="text-decoration-none fw-semibold">Login here</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
