{% extends "base.html" %}

{% block title %}Post New Job - Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center mb-5">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">{% if drive %}Edit Job Posting{% else %}Post New Job{% endif %}</h2>
            <a href="{{ url_for('company.dashboard') }}" class="btn btn-outline-secondary rounded-pill px-3"><i
                    class="bi bi-arrow-left me-1"></i> Back to Dashboard</a>
        </div>

        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <form method="POST"
                    action="{% if drive %}{{ url_for('company.edit_drive', drive_id=drive.id) }}{% else %}{{ url_for('company.create_drive') }}{% endif %}">

                    <div class="mb-4">
                        <label class="form-label text-muted fw-semibold">Job Title</label>
                        <input type="text" class="form-control form-control-lg fs-6" name="job_title"
                            value="{{ drive.job_title if drive else '' }}" required
                            placeholder="e.g. Software Engineer">
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted fw-semibold">Job Description</label>
                        <textarea class="form-control" name="job_description" rows="5" required
                            placeholder="Describe the role, responsibilities, and key skills required...">{{ drive.job_description if drive else '' }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted fw-semibold">Eligibility Criteria</label>
                        <textarea class="form-control" name="eligibility_criteria" rows="3" required
                            placeholder="e.g. B.Tech CS/IT with 7.5+ CGPA, no active backlogs...">{{ drive.eligibility_criteria if drive else '' }}</textarea>
                    </div>

                    <div class="mb-5">
                        <label class="form-label text-muted fw-semibold">Application Deadline</label>
                        <input type="datetime-local" class="form-control" name="application_deadline"
                            value="{% if drive %}{{ drive.application_deadline.strftime('%Y-%m-%dT%H:%M') }}{% endif %}"
                            required>
                        <div class="form-text mt-2"><i class="bi bi-info-circle me-1"></i> Students will not be able to
                            apply after this date and time.</div>
                    </div>

                    <div class="d-flex justify-content-end gap-3">
                        <a href="{{ url_for('company.dashboard') }}" class="btn btn-light px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-5 shadow-sm">
                            {% if drive %}Update Posting{% else %}Publish Posting{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
